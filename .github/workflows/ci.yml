
name: Build Galileo for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run tests
        run: dotnet test src/Galileo.Tests/Galileo.Tests.csproj -c Release --nologo

      - name: Build Windows application
        run: >
          dotnet publish src/Galileo.App/Galileo.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -o publish

      - name: Upload downloadable application
        uses: actions/upload-artifact@v4
        with:
          name: Galileo-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 7
